# dist_construct_definitions.toml
# Scale normalization is handled automatically using range_low and range_high.
# When constructs with different ranges are combined into meta-constructs,
# each constituent construct is normalized to [0, 1] before averaging,
# preventing accidental weighting due to scale differences.
#
# NOTE: This TOML has NO reverse-coded items as the two CFA distributions
#       it will be used to process already had reverse-coded items cleaned
#       See the construct_mapping_w_reversals.txt file included for which
#       items need reversing in the future if they're not already inverted
#       upon processing with this file.

[constructs.moral_deliberation]
columns = [
    "SPM_delib_1", "SPM_delib_2", "SPM_delib_3", "SPM_delib_4", "SPM_delib_5",
    "SPM_delib_6", "SPM_delib_7", "SPM_delib_8", "SPM_delib_9", "SPM_delib_10",
    "SPM_delib_11", "SPM_delib_12", "SPM_delib_13", "SPM_delib_14", "SPM_delib_15",
    "SPM_delib_16", "SPM_delib_17", "SPM_delib_18", "SPM_delib_19"
]
range_low = 1
range_high = 5
reverse_coded = []

