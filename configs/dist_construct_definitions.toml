# ─────────────────────────────────────────────
# Meta-constructs are computed from constructs.
# Each constituent construct is normalized to
# [0, 1] before averaging to prevent scale
# weighting artifacts.
# ─────────────────────────────────────────────

[meta_constructs.moral_adjudication]
components = ["moral_deliberation", "moral_integration"]

[meta_constructs.moral_identity]
components = ["aspired_moral_identity", "moral_self_relevance"]

[meta_constructs.moral_perception]
components = ["virtue_id", "moral_relevance", "moral_irrelevance"]

[meta_constructs.moral_emotion]
components = ["emotional_regulation", "pos_moral_emotion", "neg_moral_emotion"]

[meta_constructs.phronesis]
components = ["moral_adjudication", "moral_identity", "moral_perception", "moral_emotion"]